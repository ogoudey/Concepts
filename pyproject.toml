[project]
name = "concepts"
version = "0.1.0"
description = "concepts"
requires-python = ">=3.9"
dependencies = [
    "pydantic",
    "questionary"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["concepts*"]
